else{let ld=0;for(const l of cs)ld+=l.arm?2.4*l.hold.cost:.4*l.hold.cost;this.st-=ld*(fs>=2?1:fs?1.6:2.6)*LV[li].drain*dt;

h+='<small>Choose a limb (buttons or keys 1-4), then tap a glowing hold within reach.<br>Hold REST (Space) with 3+ points on the wall to recover stamina.</small><small style="margin-top:8px;opacity:.6">© 2026 Heather Games. All Rights Reserved.</small>';
$('menu').innerHTML=h;$('menu').classList.remove('hide')}
function go(i){if(!isOpen(i))return;$('menu').classList.add('hide');$('end').classList.add('hide');$('hud').classList.remove('hide');$('ctl').classList.remove('hide');build(i);state='count';cd=3.4;sel=0;ui()}
function finish(c){if(state!='play')return;state='over';const win=!c.ai;winTime=time;
setTimeout(()=>showEnd(win),900)}
function showEnd(win){let h=`<h1>${win?'YOU WIN!':'CAESAR WINS'}</h1><div>Time: ${winTime.toFixed(1)}s</div>`;
if(win&&(!best[li]||winTime<best[li])){best[li]=+winTime.toFixed(1);h+='<div>New best time!</div>'}else if(best[li])h+=`<div>Best: ${best[li]}s</div>`;
save();
h+=`<button onclick="go(${li})">Retry</button>`;if(li<2&&isOpen(li+1))h+=`<button onclick="go(${li+1})">Next level</button>`;h+='<button onclick="menu()">Menu</button>';
$('end').innerHTML=h;$('end').classList.remove('hide')}
document.querySelectorAll('#ctl [data-l]').forEach(b=>b.addEventListener('click',()=>{sel=+b.dataset.l;ui()}));
const rb=$('rb');rb.addEventListener('pointerdown',e=>{e.preventDefault();rs=true});['pointerup','pointerleave','pointercancel'].forEach(n=>rb.addEventListener(n,()=>rs=false));
addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='4'){sel=+e.key-1;ui()}if(e.code=='Space'||e.key=='r'){rs=true;e.preventDefault()}});
addEventListener('keyup',e=>{if(e.code=='Space'||e.key=='r')rs=false});
R.domElement.addEventListener('pointerdown',e=>{if(state!='play')return;let b=null,bd=1e9;const v=V(0,0,0);
for(const h of P.holds){v.copy(h.t).project(cam);const d=Math.hypot((v.x+1)/2*innerWidth-e.clientX,(1-v.y)/2*innerHeight-e.clientY);if(d<bd){bd=d;b=h}}
if(b&&bd<60){const m=P.tryMove(sel,b);if(m===null){sel=(sel+1)%4;ui()}else if(m)toast(m)}});
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-lt)/1000||0);lt=ts;const t=ts/1000;
if(state=='count'){cd-=dt;$('big').textContent=cd>0?Math.ceil(cd):'GO!';if(cd<=0){state='play';time=0;setTimeout(()=>{if(state!='count')$('big').textContent=''},700)}}
const pl=state=='play';if(pl)time+=dt;P.rest=rs;if(pl)A.think(dt);
for(const c of[P,A]){c.upd(pl?dt:0,t);c.draw(t)}
if(pl)for(const h of P.holds)h.mesh.material.emissive.setHex(P.can(P.L[sel],h)?0x666633:0);
else if(state!='over')for(const h of P.holds)h.mesh.material.emissive.setHex(0);
camY+=(Math.max(3.4,P.C.y+1.3)-camY)*Math.min(1,3*dt);
cam.position.set(0,camY+1.2,camD);cam.lookAt(0,camY,0);light.position.set(3,camY+8,9);light.target.position.set(0,camY,0);
if(!$('hud').classList.contains('hide')){
const top=LV[li].n*3+2.4,pr=c=>Math.round(100*Math.min(1,Math.max(0,...c.L.filter(l=>l.hold).map(l=>l.arm?l.hold.ly:0))/top));
for(const[c,b,hh]of[[P,'sp','hp'],[A,'sa','ha']]){$(b).style.width=Math.max(0,c.st)+'%';$(b).style.background=`hsl(${c.st*1.2},75%,48%)`;$(hh).textContent=pr(c)+'% up'}
$('tm').textContent=time.toFixed(1)+'s'}
R.render(S,cam)}
build(0);menu();requestAnimationFrame(loop);
