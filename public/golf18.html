 pu=loc(p.x,p.z)[1];if(p.y<=gh+R+.01&&sp<.3&&Math.abs(v.y)<.5&&Math.abs(sl)<.16)end('rest')}
function end(r){shooting=false;v.set(0,0,0);
 if(r=='rest')lastP.copy(p);else{strokes++;p.copy(lastP);toast(r=='water'?'Splash! +1 stroke':'Out of bounds! +1 stroke')}
 if(strokes>=H.par+5)return done('Stroke limit reached');
 look();pick();hud()}
function holed(){const d=strokes-H.par;done(strokes==1?'HOLE IN ONE! 🏆':['Albatross!','Eagle!','Birdie!','Par','Bogey','Double Bogey'][d+3]||(d>0?'+'+d:d))}
function done(t){shooting=false;holing=true;ball.visible=false;toast(t);setTimeout(next,2000)}
function next(){scores[H.i]=strokes;let t=-1;for(let k=1;k<=18;k++){const j=(H.i+k)%18;if(scores[j]==null){t=j;break}}t<0?fin():go(t)}
function go(i){$('menu').style.display='none';if(i==H.i&&!holing)return;if(i>=6&&!unlocked){pend=i;gate()}else build(i)}
const NM=i=>['Spring','Summer','Autumn','Winter','Sunrise','Sunset','Full Moon','Foggy','Twilight'][i<9?i:(i-5)%9]+' '+['Hills','Bridge','Tunnel'][i%3];
function openMenu(){$('grid').innerHTML=Array.from({length:18},(_,i)=>`<button class="${scores[i]!=null?'g':''}" data-i="${i}">${i+1}${i>5&&!unlocked?' 🔒':''}<small>${NM(i)}</small></button>`).join('');$('menu').style.display='flex'}
$('grid').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
$('mb').onclick=()=>{if(ready())openMenu()};
$('mback').onclick=()=>{$('menu').style.display='none';if(holing){let j=0;while(j<6&&scores[j]!=null)j++;go(j<6?j:H.i)}};
$('adx').onclick=()=>{$('ad').style.display='none';openMenu()};
function gate(){ads=0;$('adc').textContent='Ads watched: 0/3';$('adb').disabled=false;$('adb').textContent='Watch ad';$('ad').style.display='flex'}
$('adb').onclick=()=>{const b=$('adb');b.disabled=true;let t=5;b.textContent='Ad playing… '+t;const iv=setInterval(()=>{t--;if(t>0){b.textContent='Ad playing… '+t;return}clearInterval(iv);ads++;$('adc').textContent='Ads watched: '+ads+'/3';if(ads>=3){unlocked=true;$('ad').style.display='none';build(pend)}else{b.disabled=false;b.textContent='Watch next ad'}},1000)};
function fin(){let s=0;$('cards').innerHTML=scores.map((x,k)=>{s+=x;const d=x-PAR[k];return`<b style="color:${d<0?'#6be36b':d>0?'#ff8a7a':'#fff'}">${k+1}<br>${x}</b>`}).join('');
 const d=s-72;$('tot').textContent=`Total ${s} strokes (${d>0?'+':''}${d} vs par 72)`;$('end').style.display='flex'}
$('again').onclick=()=>{scores=[];unlocked=false;$('end').style.display='none';build(0)};
function shoot(){const c=CL[cl],s=c[1]*pw,lo=c[2]*Math.PI/180;strokes++;lastP.copy(p);pu=loc(p.x,p.z)[1];gr=true;
 v.set(Math.sin(aim)*Math.cos(lo)*s,Math.sin(lo)*s,-Math.cos(aim)*Math.cos(lo)*s);shooting=true;
 if(hintOn){hintOn=false;$('hint').style.opacity=0}hud()}
function toast(t){const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(tm);tm=setTimeout(()=>m.style.opacity=0,1900)}
function hud(){const t=scores.reduce((a,s,k)=>a+s-PAR[k],0);
 $('hi').textContent=`Hole ${H.i+1}/18 · Par ${H.par} · ${H.th.n}${H.i%3==0?' · Slopes':H.i%3==2?' · Tunnel':''}`;$('st').textContent=`Strokes ${strokes} · ${t>0?'+':''}${t}`;
 $('club').textContent=CL[cl][0]+' ⟳';$('dist').textContent=Math.round(dist())+' m'}
function cu(k){camA+=(aim-camA)*Math.min(1,k*1.5);const dx=Math.sin(camA),dz=-Math.cos(camA),pt=cl==2&&!shooting,[ss,uu]=loc(p.x,p.z),tn=H.tun&&ss>H.t0+3&&ss<H.t0+27&&Math.abs(uu)<5,gc=H.h(ss)+(surf(p.x,p.z)=='bridge'?.25:0),bk=tn?5:pt?7:11,hh=tn?2.2:(pt?3.5:6),cy=gc+hh+(p.y-R-gc)*.5;
 cam.position.lerp(new THREE.Vector3(p.x-dx*bk,cy,p.z-dz*bk),k);cam.lookAt(p.x+dx*(pt?8:16),gc+1+(p.y-R-gc)*.5,p.z+dz*(pt?8:16))}
function arrow(){const on=!shooting&&!holing,c=CL[cl],s=c[1]*(drag?pw:.5),lo=c[2]*Math.PI/180,len=lo?Math.max(4,s*s*Math.sin(2*lo)/G):Math.max(3,s/1.1);
 arr.visible=on;if(!on)return;arr.position.set(p.x,p.y-R+.4,p.z);arr.setDirection(new THREE.Vector3(Math.sin(aim),0,-Math.cos(aim)));arr.setLength(len,Math.min(3,len*.3),1.6)}
const cv=ren.domElement,ready=()=>!shooting&&!holing;
cv.addEventListener('pointerdown',e=>{if(!ready())return;drag={y:e.clientY,x:e.clientX};pw=0;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;aim+=(e.clientX-drag.x)*.004;drag.x=e.clientX;pw=Math.max(0,Math.min(1,(e.clientY-drag.y)/180));$('pw').style.width=pw*100+'%'});
const up=()=>{if(drag&&pw>.04&&ready())shoot();drag=null;pw=0;$('pw').style.width=0};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',()=>{drag=null;pw=0;$('pw').style.width=0});
$('club').onclick=()=>{if(ready()){cl=(cl+1)%3;hud()}};
let T=0;build(0);
(function lp(t){requestAnimationFrame(lp);const dt=Math.min(.05,(t-T)/1000||0);T=t;
 if(shooting){const n=Math.ceil(dt*120);for(let k=0;k<n&&shooting;k++)step(dt/n)}
 ball.position.copy(p);const gh=H.h(loc(p.x,p.z)[0])+(surf(p.x,p.z)=='bridge'?.25:0);shad.position.set(p.x,gh+.05,p.z);shad.scale.setScalar(Math.max(.3,1-(p.y-R)/25));shad.visible=ball.visible;
 H.flag.rotation.y=Math.sin(t/300)*.35;if(fxP){const a=fxP.geometry.attributes.position,sp=fxP.userData.sp;for(let k=0;k<a.count;k++){let y=a.getY(k)-sp*dt;if(y<0)y+=35;a.setY(k,y);a.setX(k,a.getX(k)+Math.sin(t/900+k)*.02)}a.needsUpdate=true;fxP.position.set(cam.position.x,cam.position.y-8,cam.position.z)}arrow();sky.position.copy(cam.position);cu(shooting?.07:.1);ren.render(sc,cam)})(0);
