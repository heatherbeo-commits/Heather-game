<style>

:root{

body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:22px} h3{font-size:16px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.sq:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.muted{color:var(--muted)} .sm{font-size:13px}
.row{display:flex;gap:10px;align-items:center} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0} .between{justify-content:space-between}
.top{display:flex;align-items:center;gap:10px}
.logo{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.02em}
.logo b{color:var(--accent)}

.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.icon{width:42px;padding:0;display:grid;place-items:center;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

  display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;width:100%;max-width:100%;border-radius:8px;overflow:hidden;border:2px solid var(--line);position:relative;user-select:none;touch-action:manipulation}

function makeBoard(host){
  host.className='board';host.style.cssText=skinCss();host.innerHTML='';
  var B={s:null,flip:false,sel:-1,last:null,hints:[],legal:[],onMove:null,mine:function(){return true},locked:false},cells=[];
  for(var p=0;p<64;p++){var c=document.createElement('button');c.type='button';c.dataset.p=p;host.appendChild(c);cells.push(c)}
  host.addEventListener('click',function(e){var c=e.target.closest('.sq');if(c)B.click(B.flip?63-(+c.dataset.p):+c.dataset.p)});
  B.set=function(s,last){B.s=s;B.last=last||null;B.sel=-1;B.hints=[];B.legal=E.legal(s);B.render()};
  B.render=function(){
    var s=B.s,chk=E.inCheck(s)?s.ks[s.t===1?0:1]:-1,tg=[];
    if(B.sel>=0)B.legal.forEach(function(m){if((m&63)===B.sel){var q=(m>>6)&63,f0=m&63;if((m>>16)&2)q=(f0>>3)*8+(q>f0?6:2);tg.push(q)}});
    for(var p=0;p<64;p++){
      var i=B.flip?63-p:p,c=cells[p],v=s.b[i],cl='sq '+((((i>>3)+(i&7))&1)?'d':'l');
      if(B.last&&((B.last&63)===i||((B.last>>6)&63)===i))cl+=' last';
      if(i===B.sel)cl+=' sel'; if(B.hints.indexOf(i)>=0)cl+=' hint'; if(i===chk)cl+=' chk';
      if(tg.indexOf(i)>=0)cl+=v?' cap':' dot';

      c.className=cl;

      c.setAttribute('aria-label',E.sqName(i)+(v?' '+(v>0?'white ':'black ')+'pnbrqk'[Math.abs(v)-1]:''));
    }

  B.click=function(i){

      var ms=B.legal.filter(function(m){return (m&63)===B.sel&&((m>>6)&63)===i});
      if(!ms.length)ms=B.legal.filter(function(m){var f0=m&63,q=(m>>6)&63;return f0===B.sel&&((m>>16)&2)&&((f0>>3)*8+(q>f0?6:2))===i});
      if(ms.length){
        if(ms.length>1)return promo(ms);
        return B.onMove&&B.onMove(ms[0]);
      }
    }
    var v=s.b[i];
    if(v&&((v>0)?1:-1)===s.t&&B.mine(s.t)){B.sel=(B.sel===i?-1:i)}else B.sel=-1;
    B.render();
  };
  function promo(ms){
    var d=document.createElement('div');d.className='promo';
    ms.sort(function(a,b){return ((b>>12)&7)-((a>>12)&7)}).forEach(function(m){
      var b=document.createElement('button');b.textContent=GF[(m>>12)&7];b.setAttribute('aria-label','promote');
      b.onclick=function(ev){ev.stopPropagation();d.remove();B.onMove&&B.onMove(m)};d.appendChild(b)});
    host.appendChild(d);
  }
  B.shake=function(){host.classList.remove('shake');void host.offsetWidth;host.classList.add('shake')};
  return B;
}

      if(G.clock[k]<=0){G.clock[k]=0;paint();finish({over:true,kind:'time'},G.s.t)}else paint();
    },200);
  }
  cleanup=function(){G.over=true;G.tok++;clearInterval(G.iv)};
  refresh(null);
  if(G.human&&G.human!==1)ai();
}

/* ---------- mistake review (engine based) ---------- */
async function reviewGame(G){
  var v=sheet('<h3>'+L('Reviewing your moves...','Đang xem lại nước đi...')+'</h3><div class="bar"><i id="pg" style="width:0"></i></div>');
  var mine=G.hist.filter(function(x){return x.col===G.human}).slice(-24),out=[];
  for(var i=0;i<mine.length;i++){
    var x=mine[i];
    var a=await ask({op:'think',fen:x.before,koth:!!G.s.koth,cfg:{depth:3,ms:180}});
    if(a&&a.move!==x.m){
      var b=await ask({op:'think',fen:x.after,koth:!!G.s.koth,cfg:{depth:3,ms:180}});
      var after;if(b)after=-b.score;else{var t=E.fromFEN(x.after);after=E.inCheck(t)?30000:0}
      var loss=a.score-after;
      if(loss>=60){var st=E.fromFEN(x.before);out.push({loss:loss,san:x.san,best:E.san(st,a.move),cap:E.isCapture(a.move)})}
    }
    var pg=$('#pg');if(pg)pg.style.width=Math.round((i+1)/mine.length*100)+'%';
  }
  out.sort(function(a,b){return b.loss-a.loss});out=out.slice(0,4);
  var h='<h3>'+L('Move review','Nhận xét nước đi')+'</h3>';
  if(!out.length)h+='<p>'+L('No clear mistakes found. Well played!','Không thấy sai lầm rõ ràng. Chơi tốt!')+'</p>';
  out.forEach(function(o){
    var k=o.loss>=300?['',L('Blunder','Sai lầm nặng')]:o.loss>=150?['m',L('Mistake','Sai lầm')]:['i',L('Inaccuracy','Chưa chính xác')];
    h+='<div class="rev '+k[0]+'"><b>'+k[1]+': '+esc(o.san)+'</b><div class="sm">'+L('Costs about ','Mất khoảng ')+(o.loss>=2000?L('the game','cả ván'):(o.loss/100).toFixed(1)+L(' pawns',' tốt'))+'. '+L('Better: ','Tốt hơn: ')+'<b>'+esc(o.best)+'</b>'+(o.cap?' '+L('(a capture was available)','(có thể ăn quân)'):'')+'</div></div>';
  });
  h+='<p class="muted sm">'+L('Computed by the built-in engine (depth 3).','Do engine tích hợp tính (độ sâu 3).')+'</p><button class="btn pri" id="ok">OK</button>';
  v=sheet(h);$('#ok',v).onclick=closeSheet;
}

  var P=PUZ[next],s=E.fromFEN(P.f),left=P.n,mistakes=0,busy=false,over=false;
  box.innerHTML='<div class="panel"><div class="row between"><h3>'+(s.t===1?L('White to move','Trắng đi'):L('Black to move','Đen đi'))+'</h3><span class="tag ads">'+L('Mate in ','Chiếu hết trong ')+P.n+'</span></div><div id="bd"></div><div class="status" id="st"></div><div class="row"><button class="btn grow" id="hint">'+L('Hint','Gợi ý')+'</button><button class="btn grow" id="skip">'+L('Skip','Bỏ qua')+'</button></div></div>';

  st(L('Find the checkmating move','Tìm nước chiếu hết'));
  B.onMove=async function(m){
    if(busy||over)return;busy=true;B.locked=true;
    var ok=await ask({op:'mateMoves',fen:E.toFEN(s),d:2*left-1});
    if(!ok||ok.indexOf(m)<0){mistakes++;B.sel=-1;B.render();B.shake();st(L('Not the right move. Try again.','Chưa đúng. Thử lại nhé.'),'bad');if(S.streak){S.streak=0;save()}busy=false;B.locked=false;return}

    await sleep(450);
    var d=await ask({op:'defense',fen:E.toFEN(s),d:2*left});

    busy=false;B.locked=false;
  };
  function solved(){
    var gain=Math.max(5,P.n*10-Math.min(mistakes,2)*5);addCoins(gain);S.solved++;if(!mistakes){S.streak++;S.best=Math.max(S.best,S.streak)}

  }
  $('#hint').onclick=async function(){
    if(busy||over)return;
    if(!hintsLeft())return askHintAd();

  };
  $('#skip').onclick=function(){S.pzSolved.push(next);S.streak=0;save();puzzles()};
}

    if(!practice)return;
    if(m===E.fromUCI(s,mv[k])){var san=E.san(s,m);E.make(s,m);B.set(s,m);var t=note(k);say('✓ '+san+(t?' — '+t:''),'good');k++;if(ready())return promptMe();setTimeout(function(){step();if(ready())promptMe();else setTimeout(function(){},0)},600)}
    else{B.sel=-1;B.render();B.shake();say(L('Not the book move. Book: ','Không phải nước sách. Nước đúng: ')+E.san(s,E.fromUCI(s,mv[k])),'bad')}
  };
  $('#mW').onclick=function(){mode(false)};$('#mP').onclick=function(){mode(true)};
  mode(false);
}
