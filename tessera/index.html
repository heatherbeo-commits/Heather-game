    --s: 44px;
    --t: 24px;
    --g: 3px;
  }
  @media (prefers-color-scheme: dark) {

  }
  .app { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }

  header {

    align-items: flex-end;

  }
  h1 {

  .scores { display: flex; gap: 18px; text-align: right; }

    font-weight: 500;

  .stat .num {

    font-weight: 700;
    font-size: 26px;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
  }
  .stat.best .num { color: var(--muted); }

  #board {

    padding: 8px;
    background: var(--panel);
    border-radius: 16px;
    touch-action: none;
  }
  .c {
    width: var(--s);
    height: var(--s);
    border-radius: 7px;
    background: var(--empty);
  }
  .b {
    background: var(--col);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2), inset 0 2px 0 rgba(255,255,255,0.3);

  .c.pv { opacity: 0.55; }
  .c.hl { box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2), inset 0 2px 0 rgba(255,255,255,0.3), 0 0 0 2px var(--fg); position: relative; z-index: 1; }
  .c.clr { animation: pop 0.3s ease-in forwards; }
  @keyframes pop {
    0% { transform: scale(1); filter: brightness(1); }
    40% { transform: scale(1.12); filter: brightness(1.35); }
    100% { transform: scale(0.2); opacity: 0; }
  }

  #tray {
    width: calc(8 * var(--s) + 7 * var(--g) + 16px);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .slot {
    height: calc(5 * var(--t) + 4 * var(--g) + 12px);

    align-items: center;
    justify-content: center;
    touch-action: none;
    border-radius: 12px;
    cursor: grab;
  }

  .piece .sp { visibility: hidden; }
  .ghost { position: fixed; z-index: 50; pointer-events: none; display: grid; gap: var(--g); filter: drop-shadow(0 8px 10px rgba(0,0,0,0.3)); }

  .over {
    position: absolute;
    inset: 0;
    border-radius: 16px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
    z-index: 5;
  }
